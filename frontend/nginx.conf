server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Evitar caché en HTML
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    # Resolver interno de Docker para resolución dinámica
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy hacia el Backend FastAPI
    location /api {
        set $backend_upstream http://reservaciones_backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Docs Swagger
    location /docs {
        set $backend_upstream http://reservaciones_backend:8000;
        proxy_pass $backend_upstream/docs;
        proxy_set_header Host $host;
    }
}
