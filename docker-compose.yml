version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: casino_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_casino_secret
      POSTGRES_DB: casino_reservations
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - casino_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d casino_reservations"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casino_fastapi
    restart: always
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_casino_secret
      POSTGRES_DB: casino_reservations
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - casino_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: casino_react_frontend
    restart: always
    networks:
      - casino_network

  nginx:
    image: nginx:alpine
    container_name: casino_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - casino_network

networks:
  casino_network:
    driver: bridge

volumes:
  postgres_data:
